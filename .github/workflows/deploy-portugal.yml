name: Deploy Portugal trip to GitHub Pages

on:
  push:
    branches: [cursor/portugal-trip-a2de]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-portugal
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: 'deploy: Portugal 10D9N trip (cursor/portugal-trip-a2de)'
